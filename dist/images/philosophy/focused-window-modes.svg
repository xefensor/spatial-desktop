<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-labelledby="title desc"><title id="title">Maximize compared with Fullscreen</title><desc id="desc">Maximize fills the space between Areas and temporarily parks the other window. Fullscreen fills the whole display, including the Area space.</desc><rect width="740" height="300" fill="#f6f9fb"/><g font-family="system-ui, sans-serif"><text x="20" y="29" font-size="20" fill="#263d4e" text-anchor="start">Maximize</text><text x="390" y="29" font-size="20" fill="#263d4e" text-anchor="start">Fullscreen</text><rect x="20" y="48" width="330" height="208" fill="#dbe5ec" stroke="#78909e"/><rect x="20" y="48" width="34" height="208" fill="#eef5f9" stroke="#78909e"/><rect x="316" y="48" width="34" height="208" fill="#eef5f9" stroke="#78909e"/><rect x="390" y="48" width="330" height="208" fill="#dbe5ec" stroke="#78909e"/><path d="M 78 58 H 292 C 303.2 58 306 60.8 306 72 V 232 C 306 243.2 303.2 246 292 246 H 78 C 66.8 246 64 243.2 64 232 V 72 C 64 60.8 66.8 58 78 58 Z" fill="#c9e4f3" stroke="#78909e"/><text x="185.0" y="157.0" font-size="16" fill="#263d4e" text-anchor="middle">File Browser</text><path d="M 412 56 H 698 C 709.2 56 712 58.8 712 70 V 234 C 712 245.2 709.2 248 698 248 H 412 C 400.8 248 398 245.2 398 234 V 70 C 398 58.8 400.8 56 412 56 Z" fill="#c9e4f3" stroke="#78909e"/><text x="555.0" y="157.0" font-size="16" fill="#263d4e" text-anchor="middle">File Browser</text><rect x="29" y="172" width="15" height="21" fill="#f1e1be" stroke="#bda96d"/><text x="20" y="280" font-size="14" fill="#263d4e" text-anchor="start">Areas stay · other window parks</text><text x="390" y="280" font-size="14" fill="#263d4e" text-anchor="start">App uses the entire display</text></g></svg>
