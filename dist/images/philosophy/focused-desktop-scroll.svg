<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 590" role="img" aria-labelledby="title desc"><title id="title">Vertical desktop navigation and active desktop lines</title><desc id="desc">Two vertically ordered desktop views have the same docked Areas. Desktop 1 contains Browser and Terminal. Desktop 2 contains File Browser and Note Editor. The longer line marks the current desktop.</desc><rect width="740" height="590" fill="#f6f9fb"/><g font-family="system-ui, sans-serif"><text x="20" y="29" font-size="20" fill="#263d4e" text-anchor="start">Desktop 1</text><rect x="20" y="48" width="520" height="190" fill="#dbe5ec" stroke="#78909e"/><rect x="20" y="48" width="34" height="190" fill="#eef5f9" stroke="#78909e"/><rect x="506" y="48" width="34" height="190" fill="#eef5f9" stroke="#78909e"/><path d="M 78 58 H 482 C 493.2 58 496 60.8 496 72 V 124 C 496 135.2 493.2 138 482 138 H 78 C 66.8 138 64 135.2 64 124 V 72 C 64 60.8 66.8 58 78 58 Z" fill="#cee8df" stroke="#78909e"/><text x="280.0" y="103.0" font-size="16" fill="#263d4e" text-anchor="middle">Web Browser</text><path d="M 78 148 H 482 C 493.2 148 496 150.8 496 162 V 214 C 496 225.2 493.2 228 482 228 H 78 C 66.8 228 64 225.2 64 214 V 162 C 64 150.8 66.8 148 78 148 Z" fill="#d6e1de" stroke="#78909e"/><text x="280.0" y="193.0" font-size="16" fill="#263d4e" text-anchor="middle">Terminal</text><text x="585" y="105" font-size="16" fill="#263d4e" text-anchor="start">Position lines</text><rect x="565" y="128" width="3" height="34" fill="#2e7f9e"/><rect x="566" y="172" width="2" height="22" fill="#9faeb8"/><text x="585" y="151" font-size="15" fill="#263d4e" text-anchor="start">1 · current</text><text x="585" y="190" font-size="15" fill="#263d4e" text-anchor="start">2</text><path d="M 280 253 V 284" stroke="#64859a" stroke-width="2"/><path d="M 272 278 L 280 286 L 288 278" fill="none" stroke="#64859a" stroke-width="2"/><text x="306" y="275" font-size="15" fill="#263d4e" text-anchor="start">Mouse wheel</text><text x="20" y="325" font-size="20" fill="#263d4e" text-anchor="start">Desktop 2</text><rect x="20" y="344" width="520" height="190" fill="#dbe5ec" stroke="#78909e"/><rect x="20" y="344" width="34" height="190" fill="#eef5f9" stroke="#78909e"/><rect x="506" y="344" width="34" height="190" fill="#eef5f9" stroke="#78909e"/><path d="M 78 354 H 482 C 493.2 354 496 356.8 496 368 V 420 C 496 431.2 493.2 434 482 434 H 78 C 66.8 434 64 431.2 64 420 V 368 C 64 356.8 66.8 354 78 354 Z" fill="#c9e4f3" stroke="#78909e"/><text x="280.0" y="399.0" font-size="16" fill="#263d4e" text-anchor="middle">File Browser</text><path d="M 78 444 H 482 C 493.2 444 496 446.8 496 458 V 510 C 496 521.2 493.2 524 482 524 H 78 C 66.8 524 64 521.2 64 510 V 458 C 64 446.8 66.8 444 78 444 Z" fill="#f1e1be" stroke="#78909e"/><text x="280.0" y="489.0" font-size="16" fill="#263d4e" text-anchor="middle">Note Editor</text><rect x="566" y="424" width="2" height="22" fill="#9faeb8"/><rect x="565" y="452" width="3" height="34" fill="#2e7f9e"/><text x="585" y="443" font-size="15" fill="#263d4e" text-anchor="start">1</text><text x="585" y="475" font-size="15" fill="#263d4e" text-anchor="start">2 · current</text><text x="20" y="563" font-size="15" fill="#263d4e" text-anchor="start">Areas keep their docked positions; only desktop content changes.</text></g></svg>
